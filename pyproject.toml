[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "paperboy-mcp"
version = "0.1.0"
description = "A production-ready Model Context Protocol server for PDF tools: encrypt, decrypt, merge, split, reorder, rotate, optimize, repair, and convert."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Himan Patel", email = "himan@sudostash.com" }]
keywords = ["mcp", "model-context-protocol", "pdf", "pikepdf", "ai", "llm", "claude", "pdf-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "mcp>=1.10",
    "pikepdf>=8.12",       # earlier wheels cannot do RC4/AES-128 (no OpenSSL legacy provider)
    "pypdf[crypto]>=4.0",  # crypto: reading AES-encrypted PDFs needs cryptography
    "reportlab>=4.0.4",    # 4.0.0-4.0.3 hard-require pycairo, a native build
    "Pillow>=10.0",
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
    "ruff>=0.5",
]
demo = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://sudostash.com"
Repository = "https://github.com/sudostash/paperboy"
Issues = "https://github.com/sudostash/paperboy/issues"

[project.scripts]
paperboy = "paperboy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperboy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
