[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "paperboy-mcp"
version = "0.1.0"
description = "A production-ready Model Context Protocol server for PDF tools: encrypt, decrypt, merge, split, reorder, rotate, optimize, repair, and convert."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Himan Patel", email = "himan@sudostash.com" }]
keywords = ["mcp", "model-context-protocol", "pdf", "pikepdf", "ai", "llm", "claude", "pdf-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "mcp>=1.22",
    "pikepdf>=8.12",       # earlier wheels cannot do RC4/AES-128 (no OpenSSL legacy provider)
    "pypdf>=4.0",          # text only; encrypted files are decrypted by pikepdf first
    "reportlab>=4.0.4",    # 4.0.0-4.0.3 hard-require pycairo, a native build
    "Pillow>=10.3",        # earlier ones can garble the last block of a JPEG they write,
                           # and have CVE-2023-50447 and CVE-2024-28219
    "pypdfium2>=4.30",     # page rendering (BSD-3-Clause / Apache-2.0)
    "pdfplumber>=0.11.9",  # tables (MIT); 0.11.9 pins the pdfminer.six below, and each
                           # release pins one exactly: security fixes need a new pdfplumber
    "pdfminer.six>=20251230",  # MIT; earlier versions run code from malicious PDFs
                           # (CVE-2025-64512, CVE-2025-70559)
    "markdown-it-py>=3.0", # Markdown to PDF (MIT); 2.2.0 fixed its known DoS bugs
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
    "ruff>=0.5",
]
demo = [
    "playwright>=1.40",
]
# clean_scans: finding the page in a photo, flattening its perspective, whitening.
scan = [
    "opencv-python-headless>=4.10.0.84",  # Apache-2.0; only given pixels Pillow decoded;
                                          # earlier builds won't load beside NumPy 2
    "numpy>=1.26",                   # BSD-3-Clause
]

[project.urls]
Homepage = "https://sudostash.com"
Repository = "https://github.com/sudostash/paperboy"
Issues = "https://github.com/sudostash/paperboy/issues"

[project.scripts]
paperboy = "paperboy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperboy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
